name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios

      - name: Build iOS App (.app)
        run: |
          cd ios
          xcodebuild -workspace SchoolTime.xcworkspace \
            -scheme SchoolTime \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SchoolTime.app Payload/
          zip -qr SchoolTime.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolTime-ipa
          path: ios/SchoolTime.ipa
          retention-days: 7
